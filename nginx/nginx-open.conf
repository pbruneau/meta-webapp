# HTTP - redirect all requests to HTTPS
server {
    listen 80;
    server_name pbruneau.ddns.net;

    # ACME challenge location must be before the redirect
    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name pbruneau.ddns.net;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/pbruneau.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pbruneau.ddns.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Remove the global auth_request
    # auth_request /authelia-verify;

    # Error handling for Authelia
    error_page 401 =302 https://pbruneau.ddns.net/authelia/login?redirect=$request_uri;
    client_max_body_size 10G;

    # Authelia verification endpoint
    location /authelia-verify {
        internal;
        proxy_pass http://authelia:9091/api/verify;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # Exclude Authelia's own endpoints from authentication
    location /authelia/ {
        proxy_pass http://authelia:9091/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://authelia:9091/api/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    location /static/ {
        proxy_pass http://authelia:9091/static/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    location /locales/ {
        proxy_pass http://authelia:9091/locales/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    location /hosted/ {
        alias /usr/share/nginx/html/hosted_files/;

        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        # autoindex_format html; # default
    }

    location /hosted {
        return 301 /hosted/;
    }

    location /patch-permissions/ {
        auth_request /authelia-verify;        
        proxy_pass http://patcher:7000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Protected locations
    location / {
        auth_request /authelia-verify;
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /desutom/ {
        auth_request /authelia-verify;
        proxy_pass http://desutom-frontend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /desutom/api/ {
        auth_request /authelia-verify;
        proxy_pass http://desutom-backend:5000/desutom/api/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    location /react-latex/ {
        auth_request /authelia-verify;
        proxy_pass http://react-latex:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /files {
        client_max_body_size 10G;
        auth_request /authelia-verify;
        proxy_pass http://filebrowser:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # FileBrowser specific headers
        proxy_set_header X-Forwarded-Prefix /files;
        proxy_hide_header X-Frame-Options;
    }

    location = /pdf-reader {
        return 301 /pdf-reader/;
    }

    location /pdf-reader/ {
        auth_request /authelia-verify;
        proxy_pass http://pdf-reader:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /chess-visualizer/ {
        auth_request /authelia-verify;
        proxy_pass http://chess-visualizer:3002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }    
    location /stockfish-chess/ {
        auth_request /authelia-verify;
        proxy_pass http://stockfish-ui:6001/stockfish-chess/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
