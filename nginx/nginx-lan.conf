server {
    listen 6080;
    server_name _;
    
    client_max_body_size 10G;

    # No authentication for LAN mode
    
    # Public files (no auth needed)
    location /hosted/ {
        alias /usr/share/nginx/html/hosted_files/;
        autoindex off;
    }

    # Main index
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # DESUTOM
    location /desutom/ {
        proxy_pass http://desutom-frontend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /desutom/api/ {
        proxy_pass http://desutom-backend:5000/desutom/api/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # React LaTeX
    location /react-latex/ {
        proxy_pass http://react-latex:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FileBrowser
    location /files {
        client_max_body_size 10G;
        proxy_pass http://filebrowser:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /files;
        proxy_hide_header X-Frame-Options;
    }

    # Synchronized PDF Reader
    location = /pdf-reader {
        return 301 /pdf-reader/;
    }

    location /pdf-reader/ {
        proxy_pass http://pdf-reader:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Chess Visualizer
    location /chess-visualizer/ {
        proxy_pass http://chess-visualizer:3002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Stockfish Chess
    location /stockfish-chess/ {
        proxy_pass http://stockfish-ui:6001/stockfish-chess/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Patch permissions
    location /patch-permissions/ {
        proxy_pass http://patcher:7000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Redirect port 80 to 6080 for convenience
server {
    listen 80;
    server_name _;
    return 301 http://$host:6080$request_uri;
}

# Disable port 443 in LAN mode
server {
    listen 443;
    server_name _;
    return 444; # Connection closed without response
}
